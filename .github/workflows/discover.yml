name: Discover macOS 27 firmware

on:
  pull_request:
    paths:
      - .github/workflows/discover.yml
      - .github/workflows/generate.yml
      - docs/GENERATION-CLOSURE.md
      - diffs/**
      - manifests/**
      - track.json
  workflow_dispatch:

permissions: {}

concurrency:
  group: macos-27-discovery-${{ github.ref }}
  cancel-in-progress: false

jobs:
  discover:
    permissions:
      contents: read
    uses: ipsw-diff/catalog/.github/workflows/discover.yml@dc1eaf8c4a2c9c1e133337724e4bce6cd255df9d
    with:
      policy-path: track.json
      manifests-dir: manifests
