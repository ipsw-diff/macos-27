name: Generate macOS 27 firmware diff

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: macos-27-generation
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: write
    env:
      CATALOG_COMMIT: dc1eaf8c4a2c9c1e133337724e4bce6cd255df9d
      IPSW_VERSION: 3.1.707
      IPSW_ARCHIVE_SHA256: 002113c7b9eaf4d06d5bb77dcbeb809f9b942ff18ba9fe906f3a8d2aab12df00
      SYMBOLICATOR_COMMIT: 81178cfe6c8869612ef092f6471fce3e17d95b20
      TRACK_ID: macos-27
      PLATFORM: macOS
      DEVICE: Mac17,6
      MAJOR_VERSION: "27"

    steps:
      - name: Require default-branch dispatch
        env:
          DISPATCH_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [ "$DISPATCH_REF" != refs/heads/main ]; then
            echo "generation must be dispatched from main, got $DISPATCH_REF" >&2
            exit 1
          fi

      - name: Checkout shard
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Checkout pinned catalog tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ipsw-diff/catalog
          ref: ${{ env.CATALOG_COMMIT }}
          path: catalog
          persist-credentials: false

      - name: Free disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          tool-cache: true
          swap-storage: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.3"
          enable-cache: true

      - name: Sync locked catalog environment
        working-directory: catalog
        run: uv sync --locked --all-groups

      - name: Cache AppleDB
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.config/ipsw
          key: appledb-v1-${{ runner.os }}

      - name: Install pinned ipsw
        env:
          IPSW_URL: https://github.com/blacktop/ipsw/releases/download/v3.1.707/ipsw_3.1.707_linux_x86_64.tar.gz
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/ipsw.tar.gz"
          install_dir="$RUNNER_TEMP/ipsw-bin"
          curl --fail --location --silent --show-error --output "$archive" "$IPSW_URL"
          printf '%s  %s\n' "$IPSW_ARCHIVE_SHA256" "$archive" | sha256sum --check --strict
          mkdir -p "$install_dir"
          tar -xzf "$archive" -C "$install_dir" ipsw
          printf '%s\n' "$install_dir" >> "$GITHUB_PATH"
          "$install_dir/ipsw" version

      - name: Resolve the reviewed candidate and exact IPSWs
        working-directory: catalog
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          result="$(uv run ipsw-diff-catalog discover \
            --policy ../track.json \
            --manifests-dir ../manifests)"
          printf '%s\n' "$result" | tee "$RUNNER_TEMP/discovery-before.json"
          jq --exit-status \
            --arg track "$TRACK_ID" \
            --arg platform "$PLATFORM" \
            --arg device "$DEVICE" \
            --argjson major "$MAJOR_VERSION" \
            '.status == "candidate" and
             .track_id == $track and
             .platform == $platform and
             .device == $device and
             .major_version == $major and
             .baseline.build != .latest.build' \
            "$RUNNER_TEMP/discovery-before.json"

          previous_build="$(jq --exit-status --raw-output '.baseline.build' "$RUNNER_TEMP/discovery-before.json")"
          previous_label="$(jq --exit-status --raw-output '.baseline.version' "$RUNNER_TEMP/discovery-before.json")"
          next_build="$(jq --exit-status --raw-output '.latest.build' "$RUNNER_TEMP/discovery-before.json")"
          next_label="$(jq --exit-status --raw-output '.latest.version' "$RUNNER_TEMP/discovery-before.json")"
          previous_version="${previous_label%% *}"
          next_version="${next_label%% *}"
          safe_label='^[A-Za-z0-9][A-Za-z0-9._ -]*$'
          [[ "$previous_build" =~ ^[A-Za-z0-9]+$ ]]
          [[ "$next_build" =~ ^[A-Za-z0-9]+$ ]]
          [[ "$previous_version" =~ ^[0-9]+(\.[0-9]+)*$ ]]
          [[ "$next_version" =~ ^[0-9]+(\.[0-9]+)*$ ]]
          [[ "$previous_label" =~ $safe_label ]]
          [[ "$next_label" =~ $safe_label ]]

          ipsw dl appledb --os "$PLATFORM" --device "$DEVICE" \
            --build "$previous_build" --urls --json --no-color \
            > "$RUNNER_TEMP/previous-ipsw.json"
          ipsw dl appledb --os "$PLATFORM" --device "$DEVICE" \
            --build "$next_build" --urls --json --no-color \
            > "$RUNNER_TEMP/next-ipsw.json"

          validate_record() {
            local path="$1"
            jq --exit-status --arg device "$DEVICE" '
              type == "array" and length == 1 and
              .[0].type == "ipsw" and
              (.[0].deviceMap | index($device)) != null and
              (.[0].size | type == "number" and . > 0 and floor == .) and
              (.[0].hashes["sha2-256"] | type == "string" and test("^[0-9a-f]{64}$")) and
              (.[0].links | type == "array") and
              ([.[0].links[] | select(.active == true)] | length == 1) and
              ([.[0].links[] | select(.active == true)][0].url |
                type == "string" and
                test("^https://([A-Za-z0-9-]+\\.)*(apple\\.com|cdn-apple\\.com)/[^[:space:]]+$"))
            ' "$path"
          }
          validate_record "$RUNNER_TEMP/previous-ipsw.json"
          validate_record "$RUNNER_TEMP/next-ipsw.json"

          previous_url="$(jq --exit-status --raw-output '[.[0].links[] | select(.active == true)][0].url' "$RUNNER_TEMP/previous-ipsw.json")"
          previous_size="$(jq --exit-status --raw-output '.[0].size' "$RUNNER_TEMP/previous-ipsw.json")"
          previous_sha256="$(jq --exit-status --raw-output '.[0].hashes["sha2-256"]' "$RUNNER_TEMP/previous-ipsw.json")"
          next_url="$(jq --exit-status --raw-output '[.[0].links[] | select(.active == true)][0].url' "$RUNNER_TEMP/next-ipsw.json")"
          next_size="$(jq --exit-status --raw-output '.[0].size' "$RUNNER_TEMP/next-ipsw.json")"
          next_sha256="$(jq --exit-status --raw-output '.[0].hashes["sha2-256"]' "$RUNNER_TEMP/next-ipsw.json")"
          previous_input="${previous_url##*/}"
          next_input="${next_url##*/}"
          [[ "$previous_input" =~ ^[A-Za-z0-9._+-]+\.ipsw$ ]]
          [[ "$next_input" =~ ^[A-Za-z0-9._+-]+\.ipsw$ ]]
          [[ "$previous_input" == *"_${previous_build}_"* ]]
          [[ "$next_input" == *"_${next_build}_"* ]]

          previous_slug="${previous_version//./_}"
          next_slug="${next_version//./_}"
          diff_name="${previous_slug}_${previous_build}_vs_${next_slug}_${next_build}"
          spec_id="macos-${next_version}-${previous_build}-${next_build}"
          source_tag="payload/$diff_name"
          {
            printf 'PREVIOUS_BUILD=%s\n' "$previous_build"
            printf 'PREVIOUS_LABEL=%s\n' "$previous_label"
            printf 'PREVIOUS_VERSION=%s\n' "$previous_version"
            printf 'PREVIOUS_INPUT=%s\n' "$previous_input"
            printf 'PREVIOUS_SIZE=%s\n' "$previous_size"
            printf 'PREVIOUS_SHA256=%s\n' "$previous_sha256"
            printf 'PREVIOUS_URL=%s\n' "$previous_url"
            printf 'NEXT_BUILD=%s\n' "$next_build"
            printf 'NEXT_LABEL=%s\n' "$next_label"
            printf 'NEXT_VERSION=%s\n' "$next_version"
            printf 'NEXT_INPUT=%s\n' "$next_input"
            printf 'NEXT_SIZE=%s\n' "$next_size"
            printf 'NEXT_SHA256=%s\n' "$next_sha256"
            printf 'NEXT_URL=%s\n' "$next_url"
            printf 'DIFF_NAME=%s\n' "$diff_name"
            printf 'SPEC_ID=%s\n' "$spec_id"
            printf 'SOURCE_TAG=%s\n' "$source_tag"
          } >> "$GITHUB_ENV"

      - name: Reject pre-existing publication state
        run: |
          set -euo pipefail
          test ! -e "$DIFF_NAME"
          test ! -e "diffs/$DIFF_NAME"
          test ! -e "manifests/$DIFF_NAME.json"
          test ! -e "provenance/$DIFF_NAME.json"
          branch="generated/macos-27-$NEXT_BUILD"
          if git ls-remote --exit-code --heads origin "refs/heads/$branch" >/dev/null 2>&1; then
            echo "refusing to overwrite existing branch $branch" >&2
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$SOURCE_TAG" >/dev/null 2>&1; then
            echo "refusing to overwrite existing source tag $SOURCE_TAG" >&2
            exit 1
          fi

      - name: Install apfs-fuse
        env:
          APFS_FUSE_SHA: 66b86bd525e8cb90f9012543be89b1f092b75cf3
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            fuse3 libfuse3-dev libbz2-dev libattr1-dev zlib1g-dev cmake g++ git
          src="$RUNNER_TEMP/apfs-fuse"
          git clone --quiet https://github.com/sgan81/apfs-fuse.git "$src"
          git -C "$src" checkout --quiet "$APFS_FUSE_SHA"
          git -C "$src" submodule update --init --recursive --quiet
          cmake -S "$src" -B "$src/build" -DCMAKE_BUILD_TYPE=Release
          cmake --build "$src/build" --parallel "$(nproc)"
          sudo install -m 0755 "$src/build/apfs-fuse" /usr/local/bin/apfs-fuse
          command -v apfs-fuse

      - name: Fetch symbolicator signatures
        run: |
          set -euo pipefail
          repo="$RUNNER_TEMP/symbolicator"
          git init --quiet "$repo"
          git -C "$repo" remote add origin https://github.com/blacktop/symbolicator.git
          git -C "$repo" fetch --quiet --depth 1 origin "$SYMBOLICATOR_COMMIT"
          git -C "$repo" checkout --quiet --detach FETCH_HEAD
          test "$(git -C "$repo" rev-parse HEAD)" = "$SYMBOLICATOR_COMMIT"

      - name: Add swap
        run: |
          set -euo pipefail
          swapdir=/mnt
          df "$swapdir" >/dev/null 2>&1 || swapdir=/
          avail_g="$(df -P "$swapdir" | awk 'NR==2 {print int($4/1024/1024)}')"
          size_g=$(( avail_g - 10 ))
          [ "$size_g" -gt 28 ] && size_g=28
          if [ "$size_g" -lt 8 ]; then
            echo "at least 8G swap is required; only ${avail_g}G is free on $swapdir" >&2
            exit 1
          fi
          swapfile="$swapdir/swapfile"
          sudo fallocate -l "${size_g}G" "$swapfile" || \
            sudo dd if=/dev/zero of="$swapfile" bs=1M count=$(( size_g * 1024 ))
          sudo chmod 600 "$swapfile"
          sudo mkswap "$swapfile" >/dev/null
          sudo swapon "$swapfile"
          free -h

      - name: Download and verify exact IPSWs
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          previous_dir="$RUNNER_TEMP/previous"
          next_dir="$RUNNER_TEMP/next"
          mkdir -p "$previous_dir" "$next_dir"
          ipsw dl appledb --os "$PLATFORM" --device "$DEVICE" \
            --build "$PREVIOUS_BUILD" --output "$previous_dir" --confirm
          ipsw dl appledb --os "$PLATFORM" --device "$DEVICE" \
            --build "$NEXT_BUILD" --output "$next_dir" --confirm
          previous="$previous_dir/$PREVIOUS_INPUT"
          next="$next_dir/$NEXT_INPUT"
          test -f "$previous"
          test -f "$next"
          test "$(find "$previous_dir" -maxdepth 1 -type f -name '*.ipsw' | wc -l)" -eq 1
          test "$(find "$next_dir" -maxdepth 1 -type f -name '*.ipsw' | wc -l)" -eq 1
          test "$(stat --printf='%s' "$previous")" = "$PREVIOUS_SIZE"
          test "$(stat --printf='%s' "$next")" = "$NEXT_SIZE"
          printf '%s  %s\n' "$PREVIOUS_SHA256" "$previous" | sha256sum --check --strict
          printf '%s  %s\n' "$NEXT_SHA256" "$next" | sha256sum --check --strict

      - name: Generate exact diff payload
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/generated"
          mkdir -p "$output"
          ipsw diff \
            --title "$PREVIOUS_VERSION ($PREVIOUS_BUILD) .vs $NEXT_VERSION ($NEXT_BUILD)" \
            --output "$output" \
            --markdown \
            --fw \
            --launchd \
            --feat \
            --strs \
            --ent \
            --files \
            --starts \
            --signatures "$RUNNER_TEMP/symbolicator/kernel" \
            --block-list '__TEXT.__info_plist' \
            --block-list '__AUTH_CONST.__auth_ptr' \
            "$RUNNER_TEMP/previous/$PREVIOUS_INPUT" \
            "$RUNNER_TEMP/next/$NEXT_INPUT"
          test -f "$output/$DIFF_NAME/README.md"
          test "$(find "$output" -mindepth 1 -maxdepth 1 -type d | wc -l)" -eq 1
          mv "$output/$DIFF_NAME" "$DIFF_NAME"

      - name: Commit immutable source payload
        id: source
        run: |
          set -euo pipefail
          git switch -c "generated/macos-27-$NEXT_BUILD"
          git config user.name blacktop
          git config user.email blacktop@users.noreply.github.com
          git config commit.gpgsign false
          git add -- "$DIFF_NAME"
          git -c commit.gpgsign=false commit --no-gpg-sign \
            -m "Add macOS $PREVIOUS_BUILD to $NEXT_BUILD payload"
          source_commit="$(git rev-parse HEAD)"
          if git cat-file commit "$source_commit" | grep -q '^gpgsig '; then
            echo "payload source commit must be unsigned" >&2
            exit 1
          fi
          git tag "$SOURCE_TAG" "$source_commit"
          printf 'commit=%s\n' "$source_commit" >> "$GITHUB_OUTPUT"

      - name: Materialize canonical publication metadata
        env:
          SOURCE_COMMIT: ${{ steps.source.outputs.commit }}
        run: |
          set -euo pipefail
          spec="$RUNNER_TEMP/$SPEC_ID.json"
          jq -n \
            --arg id "$SPEC_ID" \
            --arg source_commit "$SOURCE_COMMIT" \
            --arg source_path "$DIFF_NAME" \
            --arg previous_build "$PREVIOUS_BUILD" \
            --arg previous_version "$PREVIOUS_VERSION" \
            --arg previous_input "$PREVIOUS_INPUT" \
            --arg next_build "$NEXT_BUILD" \
            --arg next_version "$NEXT_VERSION" \
            --arg next_input "$NEXT_INPUT" \
            --arg platform "$PLATFORM" \
            --arg device "$DEVICE" \
            --argjson major_version "$MAJOR_VERSION" \
            '{
              schema_version: 1,
              id: $id,
              platform: $platform,
              major_version: $major_version,
              device: $device,
              from: {version: $previous_version, build: $previous_build, input: $previous_input},
              to: {version: $next_version, build: $next_build, input: $next_input},
              source: {
                repository: "https://github.com/ipsw-diff/macos-27",
                commit: $source_commit,
                path: $source_path
              },
              destination: {
                repository: "https://github.com/ipsw-diff/macos-27",
                payload_path: ("diffs/" + $source_path),
                manifest_path: ("manifests/" + $source_path + ".json")
              }
            }' > "$spec"

          mkdir -p diffs manifests provenance "$RUNNER_TEMP/archive-specs"
          git mv "$DIFF_NAME" "diffs/$DIFF_NAME"
          uv --directory catalog run ipsw-diff-catalog materialize-manifest \
            --spec "$spec" \
            --source-repo .. \
            --output "../manifests/$DIFF_NAME.json"

          cp catalog/specs/*.json "$RUNNER_TEMP/archive-specs/"
          cp "$spec" "$RUNNER_TEMP/archive-specs/"
          uv --directory catalog run ipsw-diff-catalog render-archive \
            --specs-dir "$RUNNER_TEMP/archive-specs" \
            --destination-repository https://github.com/ipsw-diff/macos-27 \
            --output ../README.md

          latest="$(jq --exit-status --compact-output '.latest' "$RUNNER_TEMP/discovery-before.json")"
          jq --argjson latest "$latest" '.baseline = $latest' track.json > "$RUNNER_TEMP/track.json"
          mv "$RUNNER_TEMP/track.json" track.json

          ipsw_version="$(ipsw version)"
          jq -n --sort-keys \
            --arg catalog_commit "$CATALOG_COMMIT" \
            --arg source_commit "$SOURCE_COMMIT" \
            --arg source_tag "$SOURCE_TAG" \
            --arg workflow_run "https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --arg workflow_commit "$GITHUB_SHA" \
            --arg ipsw_version "$ipsw_version" \
            --arg symbolicator_commit "$SYMBOLICATOR_COMMIT" \
            --arg previous_url "$PREVIOUS_URL" \
            --arg previous_sha256 "$PREVIOUS_SHA256" \
            --argjson previous_size "$PREVIOUS_SIZE" \
            --arg next_url "$NEXT_URL" \
            --arg next_sha256 "$NEXT_SHA256" \
            --argjson next_size "$NEXT_SIZE" \
            --slurpfile discovery "$RUNNER_TEMP/discovery-before.json" \
            '{
              schema_version: 1,
              catalog_commit: $catalog_commit,
              source_commit: $source_commit,
              source_tag: $source_tag,
              workflow_run: $workflow_run,
              workflow_commit: $workflow_commit,
              generator: {name: "ipsw", version: $ipsw_version},
              signatures: {
                repository: "https://github.com/blacktop/symbolicator",
                commit: $symbolicator_commit
              },
              discovery: $discovery[0],
              inputs: [
                {role: "previous", url: $previous_url, sha256: $previous_sha256, size: $previous_size},
                {role: "next", url: $next_url, sha256: $next_sha256, size: $next_size}
              ]
            }' > "provenance/$DIFF_NAME.json"

      - name: Validate publication branch
        env:
          SOURCE_COMMIT: ${{ steps.source.outputs.commit }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          spec="$RUNNER_TEMP/$SPEC_ID.json"
          uv --directory catalog run ipsw-diff-catalog materialize-manifest \
            --spec "$spec" \
            --source-repo .. \
            --output "../manifests/$DIFF_NAME.json" \
            --check
          uv --directory catalog run ipsw-diff-catalog render-archive \
            --specs-dir "$RUNNER_TEMP/archive-specs" \
            --destination-repository https://github.com/ipsw-diff/macos-27 \
            --output ../README.md \
            --check

          git add -- README.md track.json "diffs/$DIFF_NAME" \
            "manifests/$DIFF_NAME.json" "provenance/$DIFF_NAME.json"
          git -c commit.gpgsign=false commit --no-gpg-sign \
            -m "Publish macOS $PREVIOUS_BUILD to $NEXT_BUILD diff"
          publication_commit="$(git rev-parse HEAD)"
          if git cat-file commit "$publication_commit" | grep -q '^gpgsig '; then
            echo "publication commit must be unsigned" >&2
            exit 1
          fi
          test "$(git rev-parse "$SOURCE_COMMIT:$DIFF_NAME")" = \
            "$(git rev-parse "$publication_commit:diffs/$DIFF_NAME")"

          result="$(uv --directory catalog run ipsw-diff-catalog discover \
            --policy ../track.json \
            --manifests-dir ../manifests)"
          printf '%s\n' "$result" | tee "$RUNNER_TEMP/discovery-after.json"
          jq --exit-status --arg build "$NEXT_BUILD" \
            '.status == "current" and .baseline.build == $build and .latest.build == $build' \
            "$RUNNER_TEMP/discovery-after.json"
          test -z "$(git status --porcelain=v1 --untracked-files=all -- . ':!catalog')"
          test -z "$(git -C catalog status --porcelain=v1 --untracked-files=all)"

      - name: Push publication branch
        env:
          SOURCE_COMMIT: ${{ steps.source.outputs.commit }}
        run: |
          set -euo pipefail
          branch="generated/macos-27-$NEXT_BUILD"
          git push --atomic --set-upstream origin "$branch" "$SOURCE_TAG"
          remote_tag="$(git ls-remote --tags origin "refs/tags/$SOURCE_TAG" | awk '{print $1}')"
          test "$remote_tag" = "$SOURCE_COMMIT"

      - name: Publish review handoff
        run: |
          set -euo pipefail
          branch="generated/macos-27-$NEXT_BUILD"
          compare_url="https://github.com/$GITHUB_REPOSITORY/compare/main...$branch?expand=1"
          {
            echo '## Generated branch ready for review'
            echo
            echo "- $PREVIOUS_LABEL ($PREVIOUS_BUILD) to $NEXT_LABEL ($NEXT_BUILD)"
            echo "- permanent payload source tag: \`$SOURCE_TAG\`"
            echo "- generator: ipsw $IPSW_VERSION"
            echo "- workflow run: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "- open pull request: $compare_url"
            echo
            echo 'Both IPSWs passed pinned size and SHA-256 checks. The source and destination Git trees match, canonical manifest and README checks pass, both commits are unsigned, and the updated branch rediscovered as current.'
            echo
            echo "Central catalog insertion remains a separate post-merge step because it must record this PR's final merge commit."
          } >> "$GITHUB_STEP_SUMMARY"
